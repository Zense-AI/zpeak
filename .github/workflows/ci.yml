name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when src-tauri/whisper-cpu.cmake changes: cached whisper.cpp builds ignore it.
          prefix-key: v1-rust
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      # Students run old PCs. Replay the test binary on emulated CPUs: without AVX (Westmere),
      # AVX without AVX2 (Sandy Bridge), and the minimum we build for (Haswell).
      - name: Old-CPU check (Intel SDE)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          curl -sSfL -o sde.tar.xz https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-win.tar.xz
          mkdir sde && tar -xJf sde.tar.xz -C sde --strip-components=1
          bin=$(cargo test --locked --lib --no-run --message-format=json 2>/dev/null | jq -r 'select(.executable != null and .target.name == "zpeak_lib") | .executable' | head -1)
          test -n "$bin"
          for cpu in wsm:0 snb:0 hsw:1; do
            echo "== ${cpu%%:*}"
            ZPEAK_EXPECT_LOCAL_SUPPORTED=${cpu##*:} ./sde/sde.exe -${cpu%%:*} -- "$bin" --test-threads=1
          done
          curl -sSfL -o ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "== hsw whisper inference"
          ./sde/sde.exe -help-long 2>&1 | grep -i -A1 "chip" | head -40 || true
          export ZPEAK_TEST_MODEL="$(cygpath -w "$PWD")\\ggml-tiny.bin"
          ./sde/sde.exe -hsw -- "$bin" --ignored --exact local::tests::whisper_runs_on_this_cpu
          echo "== snb whisper inference must crash (proves SDE catches AVX2)"
          if ./sde/sde.exe -snb -- "$bin" --ignored --exact local::tests::whisper_runs_on_this_cpu; then
            echo "whisper ran on a CPU without AVX2 — SDE check is not effective"; exit 1
          fi
