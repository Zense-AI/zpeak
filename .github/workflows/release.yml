name: Release

# Push a tag like v0.1.0. Builds land in a *draft* release; publish it on
# GitHub after a smoke test. Only published releases reach the in-app updater
# and the website's download buttons.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            stable_name: Zpeak-Windows-x64-Setup.exe
            suffix: "-setup.exe"
          - os: macos-latest
            args: --target universal-apple-darwin
            stable_name: Zpeak-macOS-Universal.dmg
            suffix: ".dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when src-tauri/whisper-cpu.cmake changes: cached whisper.cpp builds ignore it.
          prefix-key: v2-rust
          workspaces: src-tauri
      - run: npm ci

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Zpeak ${{ github.ref_name }}
          releaseBody: See the assets below. Windows → Zpeak-Windows-x64-Setup.exe · Mac (Apple silicon and Intel) → Zpeak-macOS-Universal.dmg
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload stable-named installer for the website
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          src=$(echo "$ARTIFACTS" | jq -r '.[]' | grep -F -- "${{ matrix.suffix }}" | grep -v '\.sig$' | head -1)
          test -n "$src"
          cp "$src" "${{ matrix.stable_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.stable_name }}" --clobber
