name: Bench

# Real numbers for the README: installs a release build on a clean Windows VM, measures
# idle memory/CPU, and times local Whisper on the whisper.cpp JFK sample.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to measure
        default: v0.1.0
      models:
        description: Whisper models to time
        default: tiny base small
      app:
        description: Also install the app and measure idle memory
        type: boolean
        default: true
      compiler:
        description: C/C++ compiler for whisper.cpp (msvc or clang)
        default: msvc
      upstream:
        description: Also time the official whisper.cpp CLI on the same machine (control)
        type: boolean
        default: false

# Draft releases are only visible to a token that can write releases.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "CPU: $($cpu.Name)  cores=$($cpu.NumberOfCores) threads=$($cpu.NumberOfLogicalProcessors)"
          "RAM: {0:N1} GB" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          (Get-CimInstance Win32_OperatingSystem).Caption

      - name: Install release build
        if: inputs.app
        shell: pwsh
        run: |
          gh release download "${{ inputs.tag }}" -p Zpeak-Windows-x64-Setup.exe
          "Installer: {0:N1} MB" -f ((Get-Item Zpeak-Windows-x64-Setup.exe).Length / 1MB)
          Start-Process .\Zpeak-Windows-x64-Setup.exe -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Zpeak" -Recurse -Filter zpeak.exe | Select-Object -First 1
          "App binary: {0:N1} MB" -f ($exe.Length / 1MB)
          "Installed size: {0:N1} MB" -f ((Get-ChildItem "$env:LOCALAPPDATA\Zpeak" -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          "EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Idle memory and CPU
        if: inputs.app
        shell: pwsh
        run: |
          function Tree {
            $all = Get-CimInstance Win32_Process
            $root = $all | Where-Object { $_.Name -eq 'zpeak.exe' }
            $ids = @($root.ProcessId); $found = $true
            while ($found) {
              $found = $false
              foreach ($p in $all) { if ($ids -contains $p.ParentProcessId -and -not ($ids -contains $p.ProcessId)) { $ids += $p.ProcessId; $found = $true } }
            }
            Get-Process -Id $ids -ErrorAction SilentlyContinue
          }
          function CpuSecs($ps) { $s = 0.0; foreach ($p in $ps) { $s += $p.TotalProcessorTime.TotalSeconds }; $s }
          function Report($label) {
            $ps = Tree
            $ws = ($ps | Measure-Object WorkingSet64 -Sum).Sum / 1MB
            $pm = ($ps | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB
            $cpu0 = CpuSecs $ps
            Start-Sleep 30
            $cpu1 = CpuSecs (Tree)
            $cores = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
            "{0}: processes={1} working set={2:N0} MB private={3:N0} MB cpu(30s)={4:N2}% of machine" -f $label, $ps.Count, $ws, $pm, (100 * ($cpu1 - $cpu0) / 30 / $cores)
            $ps | Sort-Object WorkingSet64 -Descending | Format-Table Name, Id, @{n='WS MB';e={[int]($_.WorkingSet64/1MB)}}, @{n='Private MB';e={[int]($_.PrivateMemorySize64/1MB)}} | Out-String
          }
          $t = [Diagnostics.Stopwatch]::StartNew()
          Start-Process $env:EXE
          while (-not (Get-Process zpeak -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })) {
            if ($t.Elapsed.TotalSeconds -gt 60) { throw 'no window after 60 s' }
            Start-Sleep -Milliseconds 50
          }
          "Launch to settings window: {0:N2} s (first run, cold)" -f $t.Elapsed.TotalSeconds
          Start-Sleep 10
          Report 'Settings window open'
          [void](Get-Process zpeak | Where-Object { $_.MainWindowHandle -ne 0 }).CloseMainWindow()
          Start-Sleep 15
          Report 'In tray, settings closed'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v2-rust
      - name: Use clang-cl for whisper.cpp
        if: inputs.compiler == 'clang'
        shell: bash
        run: echo "CMAKE_GENERATOR_TOOLSET=ClangCL" >> $GITHUB_ENV
      - name: Local Whisper speed
        shell: bash
        working-directory: src-tauri
        run: |
          curl -sSfL -o jfk.wav https://github.com/ggerganov/whisper.cpp/raw/master/samples/jfk.wav
          for m in ${{ inputs.models }}; do curl -sSfL -o ggml-$m.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin; done
          export ZPEAK_BENCH_WAV="$(cygpath -w "$PWD")\\jfk.wav"
          for m in ${{ inputs.models }}; do
            for th in ""; do
              out=$(ZPEAK_BENCH_THREADS=$th ZPEAK_TEST_MODEL="$(cygpath -w "$PWD")\\ggml-$m.bin" \
                cargo test --release --locked -q --lib -- --ignored --exact local::tests::bench_transcribe --nocapture 2>&1) || { echo "$out" | tail -80; exit 1; }
              echo "$out" | grep -E '^(BENCH|SYSINFO)|whisper_print_timings'
            done
          done
      - name: Control — official whisper.cpp CLI, native build
        if: inputs.upstream
        shell: bash
        working-directory: src-tauri
        run: |
          git clone -q --depth 1 -b v1.7.4 https://github.com/ggerganov/whisper.cpp ../wcpp
          cmake -S ../wcpp -B ../wcpp/build -DGGML_NATIVE=ON -DWHISPER_BUILD_TESTS=OFF > /dev/null
          cmake --build ../wcpp/build --config Release -j 2 --target whisper-cli > /dev/null
          for i in 1 2; do ../wcpp/build/bin/Release/whisper-cli.exe -m ggml-tiny.bin -f jfk.wav -t 2 -l en 2>&1 | grep -E 'system_info|total time|encode time|mel time|decode time'; done
      - name: whisper.cpp build flags (ours vs upstream)
        if: always()
        shell: bash
        working-directory: src-tauri
        run: |
          c=$(ls -d target/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt | head -1)
          grep -E '^(CMAKE_BUILD_TYPE|CMAKE_C_FLAGS|CMAKE_CXX_FLAGS|CMAKE_C_FLAGS_RELEASE|CMAKE_CXX_FLAGS_RELEASE|CMAKE_GENERATOR|GGML_[A-Z0-9_]+):' "$c"
          p=$(find "$(dirname "$c")" -name 'ggml-cpu.vcxproj' | head -1)
          echo "== ours ggml-cpu.vcxproj"; grep -oE '<(Optimization|EnableEnhancedInstructionSet|RuntimeLibrary|AdditionalOptions|InlineFunctionExpansion|BasicRuntimeChecks|DebugInformationFormat)>[^<]*' "$p" | sort | uniq -c
          if [ -d ../wcpp/build ]; then
            echo "== upstream"; grep -E '^(CMAKE_BUILD_TYPE|CMAKE_C_FLAGS|CMAKE_C_FLAGS_RELEASE):' ../wcpp/build/CMakeCache.txt
            q=$(find ../wcpp/build -name 'ggml-cpu.vcxproj' | head -1)
            grep -oE '<(Optimization|EnableEnhancedInstructionSet|RuntimeLibrary|AdditionalOptions|InlineFunctionExpansion|BasicRuntimeChecks|DebugInformationFormat)>[^<]*' "$q" | sort | uniq -c
          fi
