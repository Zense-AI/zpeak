[package]
name = "zpeak"
version = "0.1.1"
description = "Speak anywhere: open-source speech-to-text for students"
authors = ["Zense AI"]
license = "MIT"
repository = "https://github.com/Zense-AI/zpeak"
edition = "2024"

[lib]
name = "zpeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
cpal = "0.15"
hound = "3.5"
whisper-rs = "0.14"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
arboard = "3"
enigo = "0.3"
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
hostname = "0.4"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
